
name: Global Network Monitor

on:
  schedule:
    - cron: "14,24,34,44,54,4 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  global-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check global internet infrastructure
        run: |
          python - <<'PY' | tee global-report.txt
          import urllib.request
          import socket
          import datetime
          import json

          print("GLOBAL NETWORK MONITOR")
          print("Time UTC:", datetime.datetime.now(datetime.timezone.utc))
          print("=" * 60)

          websites = {
                        "Steam Store": "https://store.steampowered.com/",
              "Steam Community": "https://steamcommunity.com/",
              "Steam Status": "https://steamstat.us/",
              "Steam CDN": "https://cdn.cloudflare.steamstatic.com/",
              "Cloudflare CDN": "https://www.cloudflare.com/",
              "Akamai": "https://www.akamai.com/",
              "Fastly": "https://www.fastly.com/",
              "Amazon CloudFront": "https://aws.amazon.com/cloudfront/",
              "Google Cloud": "https://cloud.google.com/",
              "Microsoft Azure": "https://azure.microsoft.com/",
              "RIPE NCC": "https://www.ripe.net/",
              "ICANN": "https://www.icann.org/",
          }

          print("\n--- WEBSITE CONNECTIVITY ---")

          for name, url in websites.items():
              try:
                  req = urllib.request.Request(
                      url,
                      headers={"User-Agent": "GlobalNetworkMonitor/1.0"}
                  )
                  with urllib.request.urlopen(req, timeout=15) as response:
                      print(f"OK | {name} | HTTP {response.status}")
              except Exception as error:
                  print(f"WARNING | {name} | {error}")

          print("\n--- DNS RESOLUTION ---")

          domains = [
          "steampowered.com",
              "steamcommunity.com",
              "steamstatic.com",
              "google.com",
              "cloudflare.com",
              "amazon.com",
              "microsoft.com",
              "github.com",
              "openai.com",
              "wikipedia.org",
          ]

          for domain in domains:
              try:
                  result = socket.getaddrinfo(
                      domain, 443, type=socket.SOCK_STREAM
                  )
                  addresses = sorted(set(item[4][0] for item in result))
                  print(f"OK | DNS | {domain} | {addresses[0]}")
              except Exception as error:
                  print(f"WARNING | DNS | {domain} | {error}")

          print("\n--- PUBLIC DNS OVER HTTPS ---")

          dns_services = {
              "Google DNS": "https://dns.google/resolve?name=example.com",
              "Cloudflare DNS": "https://cloudflare-dns.com/dns-query?name=example.com&type=A",
          }

          for name, url in dns_services.items():
              try:
                  req = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "GlobalNetworkMonitor/1.0",
                          "Accept": "application/dns-json"
                      }
                  )
                  with urllib.request.urlopen(req, timeout=15) as response:
                      data = json.loads(response.read().decode())
                      print(f"OK | {name} | HTTP {response.status} | DNS status {data.get('Status')}")
              except Exception as error:
                  print(f"WARNING | {name} | {error}")

          print("\nGLOBAL CHECK FINISHED")
          PY

      - name: Save global network report
        uses: actions/upload-artifact@v4
        with:
          name: global-report
          path: global-report.txt
          retention-days: 7
