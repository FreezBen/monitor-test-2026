
name: Europe and Poland Monitor

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  europe-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check European infrastructure
        run: |
          python - <<'PY'
          import urllib.request
          import datetime

          services = {
              "Poland - CERT Polska": "https://cert.pl/",
              "Poland - PSE": "https://www.pse.pl/",
              "Poland - NASK": "https://www.nask.pl/",
              "Germany - Deutsche Telekom": "https://www.telekom.com/",
              "France - Orange": "https://www.orange.com/",
              "UK - National Grid": "https://www.nationalgrid.com/",
              "EU - ENTSO-E": "https://www.entsoe.eu/",
              "Europe - RIPE NCC": "https://www.ripe.net/",
              "Cloudflare Europe status": "https://www.cloudflarestatus.com/",
              "AWS Europe status": "https://health.aws.amazon.com/health/status",
          }

          print("EUROPEAN INFRASTRUCTURE MONITOR")
          print("Time UTC:", datetime.datetime.now(datetime.timezone.utc))
          print("-" * 60)

          for name, url in services.items():
              try:
                  req = urllib.request.Request(
                      url,
                      headers={"User-Agent": "InfrastructureMonitor/1.0"}
                  )
                  with urllib.request.urlopen(req, timeout=15) as response:
                      print(f"OK | {name} | HTTP {response.status}")
              except Exception as error:
                  print(f"WARNING | {name} | {error}")
          PY
