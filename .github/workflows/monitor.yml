
name: Critical Infrastructure Monitor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check critical services
        run: |
          python - <<'PY'
          import urllib.request
          import datetime

          services = {
              "Cloudflare": "https://www.cloudflarestatus.com/",
              "AWS": "https://health.aws.amazon.com/health/status",
              "Google Cloud": "https://status.cloud.google.com/",
              "Microsoft Azure": "https://status.azure.com/",
              "GitHub": "https://www.githubstatus.com/",
              "OpenAI": "https://status.openai.com/",
              "Google DNS": "https://dns.google/",
          }

          print("CRITICAL INFRASTRUCTURE MONITOR")
          print("Time UTC:", datetime.datetime.now(datetime.timezone.utc))
          print("-" * 55)

          for name, url in services.items():
              try:
                  req = urllib.request.Request(
                      url,
                      headers={"User-Agent": "InfrastructureMonitor/1.0"}
                  )
                  with urllib.request.urlopen(req, timeout=15) as response:
                      print(f"OK | {name} | HTTP {response.status}")
              except Exception as error:
                  print(f"WARNING | {name} | {error}")
          PY
