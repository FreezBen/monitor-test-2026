name: Gaming Infrastructure Monitor

on:
  schedule:
    - cron: "5,15,25,35,45,55 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gaming-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Check gaming infrastructure
        run: |
          python - <<'PY' | tee gaming-report.txt
          import urllib.request
          import urllib.error
          import socket
          import ssl
          import datetime
          import time
          import json
          from urllib.parse import urlparse

          print("GAMING INFRASTRUCTURE MONITOR")
          print("Time UTC:", datetime.datetime.now(
              datetime.timezone.utc
          ).isoformat())
          print("=" * 65)

          checks = [
              ("Steam Store", "https://store.steampowered.com/"),
              ("Steam Community", "https://steamcommunity.com/"),
              ("Steam Web API", "https://api.steampowered.com/ISteamWebAPIUtil/GetSupportedAPIList/v1/"),
              ("Steam Help", "https://help.steampowered.com/"),
              ("Steam CDN", "https://cdn.cloudflare.steamstatic.com/"),
              ("Steam CDN Akamai", "https://steamcdn-a.akamaihd.net/"),

              ("Dota 2 Website", "https://www.dota2.com/"),
              ("Dota 2 Steam Community", "https://steamcommunity.com/app/570/"),
              ("Dota 2 Steam Store", "https://store.steampowered.com/app/570/"),

              ("CS2 Website", "https://www.counter-strike.net/"),
              ("CS2 Steam Community", "https://steamcommunity.com/app/730/"),
              ("CS2 Steam Store", "https://store.steampowered.com/app/730/"),
          ]

          results = []

          def report(status, name, details):
              line = f"{status} | {name} | {details}"
              print(line)
              results.append((status, name, details))

          def http_check(name, url):
              try:
                  request = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "Mozilla/5.0 GamingInfrastructureMonitor/2.0"
                      }
                  )

                  with urllib.request.urlopen(
                      request, timeout=15
                  ) as response:
                      response.read(1024)
                      report(
                          "OK",
                          name,
                          f"HTTP {response.status}"
                      )

              except urllib.error.HTTPError as error:
                  report(
                      "WARNING",
                      name,
                      f"HTTP Error {error.code}: {error.reason}"
                  )

              except Exception as error:
                  report(
                      "WARNING",
                      name,
                      str(error)[:250]
                  )

          def dns_check(name, host):
              try:
                  addresses = socket.getaddrinfo(
                      host, 443,
                      type=socket.SOCK_STREAM
                  )

                  unique = sorted(set(
                      item[4][0] for item in addresses
                  ))

                  report(
                      "OK",
                      name,
                      "DNS resolved: " + ", ".join(unique[:3])
                  )

              except Exception as error:
                  report(
                      "WARNING",
                      name,
                      "DNS lookup failed: " + str(error)[:200]
                  )

          def tcp_check(name, host):
              try:
                  with socket.create_connection(
                      (host, 443), timeout=10
                  ):
                      report("OK", name, "TCP port 443 connected")

              except Exception as error:
                  report(
                      "WARNING",
                      name,
                      "TCP connection failed: " + str(error)[:200]
                  )

          def tls_check(name, host):
              try:
                  context = ssl.create_default_context()

                  with socket.create_connection(
                      (host, 443), timeout=10
                  ) as connection:
                      with context.wrap_socket(
                          connection,
                          server_hostname=host
                      ) as secure:
                          report(
                              "OK",
                              name,
                              "TLS " + str(secure.version())
                          )

              except Exception as error:
                  report(
                      "WARNING",
                      name,
                      "TLS connection failed: " + str(error)[:200]
                  )

          print("\n========== HTTP / HTTPS ==========")

          for name, url in checks:
              http_check(name, url)

          hosts = [
              ("Steam Store", "store.steampowered.com"),
              ("Steam Community", "steamcommunity.com"),
              ("Steam API", "api.steampowered.com"),
              ("Steam CDN", "cdn.cloudflare.steamstatic.com"),
              ("Dota 2", "www.dota2.com"),
              ("CS2", "www.counter-strike.net"),
          ]

          print("\n========== DNS CHECKS ==========")

          for name, host in hosts:
              dns_check(name + " DNS", host)

          print("\n========== TCP CHECKS ==========")

          for name, host in hosts:
              tcp_check(name + " TCP", host)

          print("\n========== TLS CHECKS ==========")

          for name, host in hosts:
              tls_check(name + " TLS", host)

          print("\n========== CS2 MATCHMAKING STATUS ==========")

          try:
              url = (
                  "https://api.steampowered.com/"
                  "ICSGOServers_730/GetGameServersStatus/v1/"
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "GamingInfrastructureMonitor/2.0"
                  }
              )

              with urllib.request.urlopen(
                  request, timeout=20
              ) as response:
                  data = json.loads(
                      response.read().decode("utf-8")
                  )

              result = data.get("result")

              if not isinstance(result, dict):
                  raise ValueError("Invalid Valve API response")

              services = result.get("services", {})

              for name, state in services.items():
                  state = str(state).lower()

                  status = (
                      "WARNING"
                      if state in ("offline", "delayed", "degraded")
                      else "OK"
                  )

                  report(
                      status,
                      "CS2 " + name,
                      "Valve status: " + state
                  )

              matchmaking = result.get("matchmaking", {})
              scheduler = str(
                  matchmaking.get("scheduler", "unknown")
              ).lower()

              report(
                  "WARNING" if scheduler not in ("normal", "unknown")
                  else "OK",
                  "CS2 Matchmaking",
                  "Scheduler: " + scheduler
              )

              print(
                  "CS2 ONLINE SERVERS:",
                  matchmaking.get("online_servers", "unknown")
              )
              print(
                  "CS2 PLAYERS SEARCHING:",
                  matchmaking.get("searching_players", "unknown")
              )
              print(
                  "CS2 AVERAGE SEARCH TIME:",
                  matchmaking.get("search_seconds_avg", "unknown")
              )

              for region, info in result.get(
                  "datacenters", {}
              ).items():
                  print(
                      "CS2 REGION:",
                      region,
                      "| LOAD:",
                      info.get("load", "unknown"),
                      "| CAPACITY:",
                      info.get("capacity", "unknown")
                  )

          except Exception as error:
              report(
                  "WARNING",
                  "CS2 Matchmaking API",
                  str(error)[:250]
              )

          print("\n========== SUMMARY ==========")

          total = len(results)
          successful = sum(
              1 for status, _, _ in results
              if status == "OK"
          )
          warnings = total - successful

          print("TOTAL CHECKS:", total)
          print("SUCCESSFUL:", successful)
          print("WARNINGS:", warnings)

          print("\n========== IMPORTANT LIMITATIONS ==========")
          print(
              "HTTP, DNS, TCP and TLS checks do not prove "
              "that matchmaking or game coordinators work."
          )
          print(
              "Dota 2 coordinator and CS2 matchmaking "
              "require dedicated game-client probes."
          )

          print("\nGAMING CHECK FINISHED")
          PY

      - name: Save gaming monitoring report
        uses: actions/upload-artifact@v4
        with:
          name: gaming-report
          path: gaming-report.txt
          retention-days: 7
