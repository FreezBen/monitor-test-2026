name: Central Infrastructure Analyst

on:
  workflow_dispatch:
  schedule:
    - cron: "9,19,29,39,49,59 * * * *"

permissions:
  actions: read
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Collect and analyze reports
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import zipfile
          import io
          import datetime

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPOSITORY"]
          base = f"https://api.github.com/repos/{repo}"

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"
          }

          targets = {
              "Critical Infrastructure Monitor": "monitor-report",
              "Europe and Poland Monitor": "europe-report",
              "Global Network Monitor": "global-report",
              "Gaming Infrastructure Monitor": "gaming-report"
          }

          problems = []
          missing = []
          server_errors = []
          retry_errors = []
          info_events = []

          def get_json(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode())

          print("CENTRAL INFRASTRUCTURE ANALYST")
          print("UTC:", datetime.datetime.now(datetime.timezone.utc))
          print("=" * 60)

          runs_data = get_json(base + "/actions/runs?per_page=100")
          runs = runs_data.get("workflow_runs", [])

          for workflow, artifact_name in targets.items():
              print("\nMODULE:", workflow)

              matching = [
                  r for r in runs
                  if r.get("name") == workflow
                  and r.get("status") == "completed"
              ]

              if not matching:
                  print("UNKNOWN: No completed run found")
                  missing.append(workflow)
                  continue

              run = matching[0]
              print("Run:", run["id"])
              print("Conclusion:", run.get("conclusion"))

              artifacts_data = get_json(
                  base + f"/actions/runs/{run['id']}/artifacts"
              )

              artifact = next(
                  (a for a in artifacts_data.get("artifacts", [])
                   if a.get("name") == artifact_name
                   and not a.get("expired")),
                  None
              )

              if not artifact:
                  print("UNKNOWN: Report artifact not found")
                  missing.append(workflow)
                  continue

              
              download_url = artifact["archive_download_url"]

              class SafeRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self, req, fp, code, msg, hdrs, newurl):
                      return urllib.request.Request(
                          newurl,
                          headers={"User-Agent": "Infrastructure-Monitor"}
                      )

              opener = urllib.request.build_opener(SafeRedirect())
              req = urllib.request.Request(download_url, headers=headers)

              with opener.open(req, timeout=60) as r:
                  archive = zipfile.ZipFile(io.BytesIO(r.read()))


              for filename in archive.namelist():
                  if not filename.endswith(".txt"):
                      continue

                  report = archive.read(filename).decode(
                      "utf-8", errors="replace"
                  )

                  print("--- REPORT:", filename, "---")
                  for line in report.splitlines():
                      print(line)

                      upper = line.upper()

                      if "HTTP ERROR 403" in upper or "HTTP 403" in upper:
                          info_events.append((workflow, line))

                      elif any(code in upper for code in
                               ["HTTP 500", "HTTP 502", "HTTP 503",
                                "HTTP 504", "HTTP ERROR 500",
                                "HTTP ERROR 502", "HTTP ERROR 503",
                                "HTTP ERROR 504"]):
                          server_errors.append((workflow, line))

                      elif any(word in upper for word in
                               ["TIMEOUT", "TIMED OUT", "FAILED",
                                "ERROR", "NO ADDRESS ASSOCIATED"]):
                          retry_errors.append((workflow, line))

          
          print("\n" + "=" * 60)
          print("CENTRAL ASSESSMENT")

          print("Server errors:", len(server_errors))
          print("Errors requiring recheck:", len(retry_errors))
          print("Access restrictions (403):", len(info_events))
          print("Missing reports:", len(missing))

          affected_modules = len(set(
              workflow for workflow, line in server_errors
          ))

          if missing:
              print("ALERT LEVEL: UNKNOWN")
              print("Some monitoring reports are unavailable.")

          elif affected_modules >= 3:
              print("ALERT LEVEL: RED")
              print("Multiple independent modules report server errors.")

          elif affected_modules >= 2:
              print("ALERT LEVEL: ORANGE")
              print("Several monitoring modules report server errors.")

          elif server_errors:
              print("ALERT LEVEL: YELLOW")
              print("Server error detected. Further verification required.")

          elif retry_errors:
              print("ALERT LEVEL: YELLOW")
              print("Connectivity or DNS issues require rechecking.")

          else:
              print("ALERT LEVEL: GREEN")
              print("No confirmed infrastructure failures detected.")

          if info_events:
              print("\nINFORMATIONAL EVENTS:")
              for workflow, line in info_events:
                  print("-", workflow, "|", line)

          print("\nNOTE: HTTP 403 is not treated as an outage.")
          print("A successful HTTP response does not guarantee")
          print("that the underlying service is fully operational.")

          # SAVE ANALYSIS HISTORY
          os.makedirs("reports", exist_ok=True)

          history_record = {
              "timestamp": datetime.datetime.now(
                  datetime.timezone.utc
              ).isoformat(),
              "server_errors": len(server_errors),
              "retry_errors": len(retry_errors),
              "access_restrictions": len(info_events),
              "missing_reports": len(missing),
              "affected_modules": affected_modules
          }

          with open("reports/history.jsonl", "a", encoding="utf-8") as history:
              history.write(json.dumps(history_record) + "\n")

          print("HISTORY: New analysis record saved.")

          PY
      - name: Commit analysis history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/history.jsonl
          if git diff --cached --quiet; then
            echo "No history changes to commit"
          else
            git commit -m "Update infrastructure monitoring history"
            git push
          fi
