name: Central Infrastructure Analyst

on:
  workflow_dispatch:
  schedule:
    - cron: "9,19,29,39,49,59 * * * *"

permissions:
  actions: read
  contents: write

concurrency:
  group: central-infrastructure-analyst
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Collect and analyze reports
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os
          import re
          import json
          import io
          import zipfile
          import urllib.request
          import urllib.error
          import datetime
          from urllib.parse import urlparse
          from urllib.request import HTTPRedirectHandler, build_opener

          print("CENTRAL INFRASTRUCTURE ANALYST")
          now = datetime.datetime.now(datetime.timezone.utc)
          print("UTC:", now.isoformat())
          print("=" * 60)

          TOKEN = os.environ["GH_TOKEN"]
          REPO = os.environ["REPOSITORY"]
          API = "https://api.github.com"

          MODULES = {
              "Critical Infrastructure Monitor": "monitor-report",
              "Europe and Poland Monitor": "europe-report",
              "Global Network Monitor": "global-report",
              "Gaming Infrastructure Monitor": "gaming-report"
          }

          class SafeRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  new_req = super().redirect_request(
                      req, fp, code, msg, headers, newurl
                  )
                  if new_req:
                      if urlparse(req.full_url).netloc != urlparse(newurl).netloc:
                          new_req.remove_header("Authorization")
                          new_req.remove_header("Accept")
                  return new_req

          opener = build_opener(SafeRedirect)

          def request_url(url, binary=False):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": "Bearer " + TOKEN,
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "Infrastructure-Monitor"
                  }
              )
              with opener.open(req, timeout=45) as response:
                  data = response.read()
              if binary:
                  return data
              return json.loads(data.decode("utf-8"))

          def get_latest_run(workflow_name):
              url = API + "/repos/" + REPO + "/actions/runs?per_page=100"
              data = request_url(url)

              matches = [
                  r for r in data.get("workflow_runs", [])
                  if r.get("name") == workflow_name
                  and r.get("status") == "completed"
                  and r.get("conclusion") == "success"
              ]

              if not matches:
                  return None

              matches.sort(
                  key=lambda r: r.get("created_at", ""),
                  reverse=True
              )
              return matches[0]

          def get_report(artifact_name, run_id):
              url = (
                  API + "/repos/" + REPO
                  + "/actions/runs/" + str(run_id)
                  + "/artifacts?per_page=100"
              )

              data = request_url(url)

              artifact = next(
                  (
                      a for a in data.get("artifacts", [])
                      if a.get("name") == artifact_name
                      and not a.get("expired", False)
                  ),
                  None
              )

              if not artifact:
                  return None

              archive_url = (
                  API + "/repos/" + REPO
                  + "/actions/artifacts/"
                  + str(artifact["id"]) + "/zip"
              )

              archive = request_url(archive_url, binary=True)

              with zipfile.ZipFile(io.BytesIO(archive)) as z:
                  files = [
                      name for name in z.namelist()
                      if name.lower().endswith((".txt", ".log"))
                  ]

                  if not files:
                      return None

                  return "\n".join(
                      z.read(name).decode("utf-8", errors="replace")
                      for name in files
                  )

          # --------------------------------------------------
          # COLLECT REPORTS
          # --------------------------------------------------

          server_errors = []
          retry_errors = []
          info_events = []
          missing = []
          dns_events = []
          affected_modules = set()
          provider_failures = {}
          dns_providers = {}

          def identify_provider(label):
              value = label.lower()

              aliases = [
                  ("cloudflare", "Cloudflare"),
                  ("aws", "AWS"),
                  ("amazon", "AWS"),
                  ("google", "Google"),
                  ("azure", "Microsoft Azure"),
                  ("microsoft", "Microsoft Azure"),
                  ("github", "GitHub"),
                  ("openai", "OpenAI"),
                  ("steam", "Steam"),
                  ("akamai", "Akamai"),
                  ("fastly", "Fastly"),
                  ("cloudfront", "CloudFront"),
                  ("orange", "Orange"),
                  ("deutsche telekom", "Deutsche Telekom"),
                  ("national grid", "National Grid"),
                  ("entso-e", "ENTSO-E"),
                  ("ripe", "RIPE NCC"),
                  ("cert polska", "CERT Polska"),
                  ("pse", "PSE"),
                  ("nask", "NASK"),
                  ("icann", "ICANN")
              ]

              for key, name in aliases:
                  if key in value:
                      return name

              return label.strip()

          dns_patterns = [
              "dns lookup",
              "name resolution",
              "getaddrinfo failed",
              "temporary failure in name resolution",
              "failed to resolve",
              "could not resolve",
              "name or service not known",
              "nodename nor servname",
              "dns_probe",
              "no address associated"
          ]

          timeout_patterns = [
              "timed out",
              "timeout",
              "connection refused",
              "connection reset",
              "connectionerror",
              "urlopen error",
              "network is unreachable",
              "failed to establish",
              "max retries exceeded",
              "remote end closed",
              "ssl error"
          ]

          for module, artifact in MODULES.items():
              print("\nMODULE:", module)

              try:
                  run = get_latest_run(module)

                  if not run:
                      print("WARNING: No successful completed run found.")
                      missing.append(module)
                      continue

                  print("Run:", run["id"])
                  print("Conclusion:", run["conclusion"])

                  report = get_report(artifact, run["id"])

                  if report is None:
                      print("WARNING: Report artifact not found.")
                      missing.append(module)
                      continue

                  print("--- REPORT ---")
                  print(report)

                  module_has_problem = False

                  for line in report.splitlines():
                      if "|" not in line:
                          continue

                      parts = line.split("|")
                      if len(parts) < 3:
                          continue

                      status = parts[0].strip().upper()
                      label = parts[1].strip()
                      details = "|".join(parts[2:]).strip()
                      lower = (line + " " + details).lower()

                      provider = identify_provider(label)

                      http_match = re.search(
                          r"HTTP(?:\s+Error)?\s*[:=]?\s*(\d{3})",
                          details,
                          re.IGNORECASE
                      )

                      http_code = (
                          int(http_match.group(1))
                          if http_match else None
                      )

                      # HTTP 403 is an access restriction,
                      # not proof of a service outage.
                      if http_code == 403:
                          info_events.append({
                              "module": module,
                              "provider": provider,
                              "line": line
                          })
                          continue

                      is_dns = any(
                          pattern in lower for pattern in dns_patterns
                      )

                      is_timeout = any(
                          pattern in lower for pattern in timeout_patterns
                      )

                      is_server_error = (
                          http_code is not None
                          and 500 <= http_code <= 599
                      )

                      is_retry_error = (
                          is_dns
                          or is_timeout
                          or (
                              http_code is not None
                              and 400 <= http_code <= 499
                          )
                          or status in ("ERROR", "FAIL", "FAILED")
                          or (
                              status == "WARNING"
                              and not is_server_error
                          )
                      )

                      if is_server_error:
                          server_errors.append({
                              "module": module,
                              "provider": provider,
                              "line": line
                          })
                          provider_failures[provider] = (
                              provider_failures.get(provider, 0) + 1
                          )
                          module_has_problem = True

                      elif is_retry_error:
                          retry_errors.append({
                              "module": module,
                              "provider": provider,
                              "line": line
                          })
                          provider_failures[provider] = (
                              provider_failures.get(provider, 0) + 1
                          )
                          module_has_problem = True

                          if is_dns:
                              dns_events.append({
                                  "module": module,
                                  "provider": provider,
                                  "line": line
                              })
                              dns_providers[provider] = (
                                  dns_providers.get(provider, 0) + 1
                              )

                  if module_has_problem:
                      affected_modules.add(module)

              except Exception as error:
                  print("COLLECTION ERROR:", str(error))
                  missing.append(module)

          # --------------------------------------------------
          # CURRENT ANALYSIS
          # --------------------------------------------------

          failed_providers = sorted(provider_failures.keys())

          print("\n" + "=" * 60)
          print("CURRENT ANALYSIS")
          print("=" * 60)

          print("Server errors:", len(server_errors))
          print("Retry errors:", len(retry_errors))
          print("DNS errors:", len(dns_events))
          print("Access restrictions:", len(info_events))
          print("Missing reports:", len(missing))
          print("Affected modules:", len(affected_modules))
          print("Independent affected providers:", len(failed_providers))

          if failed_providers:
              print("Affected providers:", ", ".join(failed_providers))

          if dns_providers:
              print("DNS failure providers:", json.dumps(dns_providers))

          # --------------------------------------------------
          # LOAD HISTORY
          # --------------------------------------------------

          history_path = "reports/history.jsonl"
          os.makedirs("reports", exist_ok=True)

          records = []

          if os.path.exists(history_path):
              with open(history_path, "r", encoding="utf-8") as history:
                  for line in history:
                      if not line.strip():
                          continue
                      try:
                          records.append(json.loads(line))
                      except json.JSONDecodeError:
                          print("WARNING: Invalid history record skipped.")

          def parse_time(record):
              try:
                  value = record["timestamp"].replace("Z", "+00:00")
                  return datetime.datetime.fromisoformat(value)
              except Exception:
                  return None

          # --------------------------------------------------
          # REPEATED DNS ANALYSIS
          # --------------------------------------------------

          def recent_records(hours):
              start = now - datetime.timedelta(hours=hours)
              result = []

              for record in records:
                  timestamp = parse_time(record)
                  if timestamp and start <= timestamp <= now:
                      result.append(record)

              return result

          last_6h = recent_records(6)

          dns_6h = sum(
              r.get("dns_errors", 0)
              for r in last_6h
          ) + len(dns_events)

          print("\n" + "=" * 60)
          print("DNS RECURRING FAILURE ANALYSIS")
          print("=" * 60)

          print("DNS errors in last 6 hours:", dns_6h)

          if dns_6h >= 6:
              print("DNS STATUS: CRITICAL - repeated failures")
          elif dns_6h >= 3:
              print("DNS STATUS: WARNING - recurring failures")
          elif dns_6h > 0:
              print("DNS STATUS: Isolated failures detected")
          else:
              print("DNS STATUS: No recorded failures")

          # --------------------------------------------------
          # SIX-HOUR AND 24-HOUR TREND ANALYSIS
          # --------------------------------------------------

          current_record = {
              "timestamp": now.isoformat(),
              "server_errors": len(server_errors),
              "retry_errors": len(retry_errors),
              "dns_errors": len(dns_events),
              "access_restrictions": len(info_events),
              "missing_reports": len(missing),
              "affected_modules": len(affected_modules),
              "failed_providers": failed_providers
          }

          analysis_records = records + [current_record]

          def summarize_window(hours, end_time):
              start_time = end_time - datetime.timedelta(hours=hours)

              selected = []

              for record in analysis_records:
                  timestamp = parse_time(record)

                  if timestamp and start_time <= timestamp < end_time:
                      selected.append(record)

              problem_checks = sum(
                  1 for r in selected
                  if r.get("server_errors", 0) > 0
                  or r.get("retry_errors", 0) > 0
              )

              return {
                  "records": len(selected),
                  "problem_checks": problem_checks,
                  "server_errors": sum(
                      r.get("server_errors", 0) for r in selected
                  ),
                  "retry_errors": sum(
                      r.get("retry_errors", 0) for r in selected
                  ),
                  "dns_errors": sum(
                      r.get("dns_errors", 0) for r in selected
                  )
              }

          def compare_windows(hours):
              current = summarize_window(hours, now)
              previous = summarize_window(
                  hours,
                  now - datetime.timedelta(hours=hours)
              )

              print("\nPERIOD:", hours, "HOURS")
              print("Current period records:", current["records"])
              print("Previous period records:", previous["records"])
              print("Current problem checks:", current["problem_checks"])
              print("Previous problem checks:", previous["problem_checks"])
              print("Current server errors:", current["server_errors"])
              print("Current DNS errors:", current["dns_errors"])

              if previous["records"] < 2:
                  trend = "INSUFFICIENT DATA"
              elif (
                  current["problem_checks"] >= 3
                  and current["problem_checks"]
                  > previous["problem_checks"] * 1.5
              ):
                  trend = "DETERIORATING"
              elif (
                  previous["problem_checks"] >= 3
                  and current["problem_checks"]
                  < previous["problem_checks"]
              ):
                  trend = "IMPROVING"
              else:
                  trend = "STABLE"

              print("TREND:", trend)

              return current, previous, trend

          print("\n" + "=" * 60)
          print("HISTORICAL TREND ANALYSIS")
          print("=" * 60)

          current_6h, previous_6h, trend_6h = compare_windows(6)
          current_24h, previous_24h, trend_24h = compare_windows(24)

          # --------------------------------------------------
          # AUTOMATIC ALERT LEVEL
          # --------------------------------------------------

          alert_level = "GREEN"

          if (
              len(failed_providers) >= 2
              and len(server_errors) + len(retry_errors) >= 2
          ):
              alert_level = "RED"

          elif (
              len(server_errors) >= 3
              and len(failed_providers) >= 2
          ):
              alert_level = "RED"

          elif dns_6h >= 6:
              alert_level = "RED"

          elif (
              server_errors
              or retry_errors
              or missing
              or dns_6h >= 3
          ):
              alert_level = "YELLOW"

          # Escalate when the six-hour trend deteriorates
          # and multiple problematic checks are recorded.
          if (
              trend_6h == "DETERIORATING"
              and current_6h["problem_checks"] >= 6
          ):
              alert_level = "RED"

          print("\n" + "=" * 60)
          print("FINAL INFRASTRUCTURE ASSESSMENT")
          print("=" * 60)

          print("ALERT LEVEL:", alert_level)
          print("TREND 6H:", trend_6h)
          print("TREND 24H:", trend_24h)

          if alert_level == "RED":
              print("CRITICAL: Multiple or persistent infrastructure problems.")
          elif alert_level == "YELLOW":
              print("WARNING: Issues detected; further monitoring required.")
          else:
              print("NORMAL: No confirmed problems in monitored endpoints.")

          # --------------------------------------------------
          # SAVE HISTORY
          # --------------------------------------------------

          history_record = {
              "timestamp": now.isoformat(),
              "server_errors": len(server_errors),
              "retry_errors": len(retry_errors),
              "dns_errors": len(dns_events),
              "access_restrictions": len(info_events),
              "missing_reports": len(missing),
              "affected_modules": len(affected_modules),
              "failed_providers": failed_providers,
              "dns_providers": dns_providers,
              "alert_level": alert_level,
              "trend_6h": trend_6h,
              "trend_24h": trend_24h,
              "problem_checks_6h": current_6h["problem_checks"],
              "problem_checks_24h": current_24h["problem_checks"]
          }

          with open(history_path, "a", encoding="utf-8") as history:
              history.write(json.dumps(history_record) + "\n")

          print("\nHISTORY: New analysis record saved.")
          print("HISTORY RECORDS:", len(records) + 1)
          PY

      - name: Commit analysis history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add reports/history.jsonl

          if git diff --cached --quiet; then
            echo "No history changes to commit"
          else
            git commit -m "Update infrastructure monitoring history"
            git push
          fi
