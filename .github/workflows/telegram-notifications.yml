
name: Telegram Infrastructure Notifications

on:
  workflow_run:
    workflows:
      - "Central Infrastructure Analyst"
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request

          TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
          CHAT_ID = os.environ["TELEGRAM_CHAT_ID"]
          EVENT = os.environ["EVENT_NAME"]

          if not TOKEN or not CHAT_ID:
              raise RuntimeError("Telegram secrets are missing")

          def send_message(message):
              url = (
                  "https://api.telegram.org/bot"
                  + TOKEN
                  + "/sendMessage"
              )

              payload = {
                  "chat_id": CHAT_ID,
                  "text": message
              }

              request = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={"Content-Type": "application/json"},
                  method="POST"
              )

              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.loads(
                      response.read().decode("utf-8")
                  )

              if not result.get("ok"):
                  raise RuntimeError("Telegram rejected message")

              print("TELEGRAM: Message sent successfully.")

          # Manual test
          if EVENT == "workflow_dispatch":
              send_message(
                  "INFRASTRUCTURE MONITOR\n\n"
                  "Telegram connection successful!\n"
                  "Automatic alerts are active."
              )
              raise SystemExit(0)

          history_path = "reports/history.jsonl"

          if not os.path.exists(history_path):
              print("History file not found.")
              raise SystemExit(0)

          records = []

          with open(history_path, "r", encoding="utf-8") as file:
              for line in file:
                  if line.strip():
                      try:
                          records.append(json.loads(line))
                      except json.JSONDecodeError:
                          continue

          if len(records) < 2:
              print("Not enough history.")
              raise SystemExit(0)

          current = records[-1]
          previous = records[-2]

          old_level = previous.get("alert_level", "UNKNOWN")
          new_level = current.get("alert_level", "UNKNOWN")

          timestamp = current.get("timestamp", "Unknown")

          server_errors = current.get("server_errors", 0)
          retry_errors = current.get("retry_errors", 0)
          dns_errors = current.get("dns_errors", 0)
          affected = current.get("affected_modules", 0)

          trend_6h = current.get("trend_6h", "UNKNOWN")
          trend_24h = current.get("trend_24h", "UNKNOWN")

          message = None

          # Count consecutive RED records
          consecutive_red = 0

          for record in reversed(records):
              if record.get("alert_level") == "RED":
                  consecutive_red += 1
              else:
                  break

          # First RED: immediate critical alert
          if new_level == "RED" and old_level != "RED":
              message = (
                  "CRITICAL INFRASTRUCTURE ALERT\n\n"
                  "RED ALERT DETECTED!\n\n"
                  "Infrastructure problems detected.\n\n"
                  "Server errors: " + str(server_errors)
                  + "\nRetry errors: " + str(retry_errors)
                  + "\nDNS errors: " + str(dns_errors)
                  + "\nAffected modules: " + str(affected)
                  + "\n\nTrend 6H: " + str(trend_6h)
                  + "\nTrend 24H: " + str(trend_24h)
                  + "\n\nUTC: " + str(timestamp)
              )

          # Repeated RED: reminder every 3 checks
          elif new_level == "RED" and consecutive_red % 3 == 0:
              message = (
                  "INFRASTRUCTURE ALERT REMINDER\n\n"
                  "RED ALERT IS STILL ACTIVE!\n\n"
                  "Consecutive critical checks: "
                  + str(consecutive_red)
                  + "\nServer errors: " + str(server_errors)
                  + "\nRetry errors: " + str(retry_errors)
                  + "\nDNS errors: " + str(dns_errors)
                  + "\n\nUTC: " + str(timestamp)
              )

          # Recovery
          elif (
              new_level == "GREEN"
              and old_level in ("RED", "YELLOW")
          ):
              message = (
                  "INFRASTRUCTURE RECOVERY\n\n"
                  "PROBLEMS HAVE CLEARED!\n\n"
                  "Previous level: " + old_level
                  + "\nCurrent level: GREEN"
                  + "\n\nServer errors: " + str(server_errors)
                  + "\nRetry errors: " + str(retry_errors)
                  + "\nDNS errors: " + str(dns_errors)
                  + "\n\nUTC: " + str(timestamp)
              )

          # Other alert level changes
          elif new_level != old_level:
              message = (
                  "INFRASTRUCTURE STATUS CHANGE\n\n"
                  + old_level + " -> " + new_level
                  + "\n\nServer errors: " + str(server_errors)
                  + "\nRetry errors: " + str(retry_errors)
                  + "\nDNS errors: " + str(dns_errors)
                  + "\n\nUTC: " + str(timestamp)
              )

          if message:
              send_message(message)
          else:
              print(
                  "No notification required. "
                  "Current level:", new_level
              )
          PY
